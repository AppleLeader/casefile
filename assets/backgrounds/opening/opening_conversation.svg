<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="wallBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a332a"/>
      <stop offset="100%" stop-color="#1b1a17"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a221a"/>
      <stop offset="100%" stop-color="#0a0907"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="30%" r="55%">
      <stop offset="0%"   stop-color="#f4dca8" stop-opacity="0.9"/>
      <stop offset="35%"  stop-color="#d9b47a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d9b47a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowCool" cx="20%" cy="40%" r="40%">
      <stop offset="0%"   stop-color="#a8b8c8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a8b8c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#wallBg)"/>
  <rect x="0" y="820" width="1920" height="260" fill="url(#floor)"/>

  <!-- Window on the left (behind Adrian) -->
  <g>
    <rect x="100" y="180" width="420" height="620" fill="#1a2430"/>
    <rect x="100" y="180" width="420" height="620" fill="none" stroke="#0a0907" stroke-width="8"/>
    <line x1="310" y1="180" x2="310" y2="800" stroke="#0a0907" stroke-width="6"/>
    <line x1="100" y1="490" x2="520" y2="490" stroke="#0a0907" stroke-width="6"/>
    <rect x="100" y="180" width="420" height="620" fill="url(#windowCool)"/>
    <!-- Distant city lights through the window -->
    <g fill="#d9b47a" opacity="0.4">
      <rect x="130" y="600" width="4" height="6"/>
      <rect x="200" y="560" width="4" height="6"/>
      <rect x="280" y="620" width="4" height="6"/>
      <rect x="380" y="580" width="4" height="6"/>
      <rect x="450" y="620" width="4" height="6"/>
    </g>
  </g>

  <!-- Back wall shelf with a couple of books (right side) -->
  <g>
    <rect x="1500" y="360" width="360" height="20" fill="#3a2010"/>
    <rect x="1520" y="300" width="24" height="60" fill="#7a2f2a"/>
    <rect x="1550" y="310" width="20" height="50" fill="#4a5a44"/>
    <rect x="1580" y="295" width="18" height="65" fill="#2a2823"/>
    <rect x="1620" y="320" width="30" height="40" fill="#b9905a"/>
    <!-- Second shelf -->
    <rect x="1500" y="520" width="360" height="20" fill="#3a2010"/>
    <rect x="1520" y="470" width="22" height="50" fill="#2a2823"/>
    <rect x="1560" y="480" width="16" height="40" fill="#7a2f2a"/>
  </g>

  <!-- Wall lamp (upper right, dim, adds warmth) -->
  <g>
    <ellipse cx="1680" cy="180" rx="40" ry="12" fill="#0a0907"/>
    <circle cx="1680" cy="180" r="10" fill="#d9b47a" opacity="0.7"/>
    <ellipse cx="1680" cy="260" rx="200" ry="140" fill="url(#lamp)" opacity="0.35"/>
  </g>

  <!-- Desk (foreground, filling the bottom third) -->
  <g>
    <rect x="500" y="820" width="920" height="40" fill="#5a3a2a" stroke="#0a0907" stroke-width="4"/>
    <rect x="520" y="860" width="30" height="220" fill="#3a2010"/>
    <rect x="1380" y="860" width="30" height="220" fill="#3a2010"/>
    <rect x="520" y="860" width="890" height="10" fill="#1a0a02" opacity="0.5"/>
  </g>

  <!-- Desk lamp (center, ON) — glowing warm -->
  <g>
    <ellipse cx="960" cy="815" rx="55" ry="8" fill="#1a0808"/>
    <rect x="952" y="740" width="16" height="75" fill="#0a0907"/>
    <path d="M 900 740 L 1020 740 L 1000 705 L 920 705 Z" fill="#4a6a4a" stroke="#0a0907" stroke-width="3"/>
    <ellipse cx="960" cy="742" rx="60" ry="9" fill="#3a5a3a"/>
    <ellipse cx="960" cy="742" rx="45" ry="4" fill="#f4dca8"/>
    <ellipse cx="960" cy="880" rx="340" ry="200" fill="url(#lamp)" opacity="0.75"/>
  </g>

  <!-- Papers on the desk (between the two characters) -->
  <g fill="#ece4d4" stroke="#8a7860" stroke-width="2">
    <rect x="880" y="800" width="90" height="20" transform="rotate(-3 925 810)"/>
    <rect x="900" y="795" width="90" height="20" transform="rotate(2 945 805)"/>
    <rect x="1000" y="800" width="80" height="20" transform="rotate(-1 1040 810)"/>
  </g>

  <!-- ADRIAN (left, seated behind desk) -->
  <g>
    <!-- Chair back behind him -->
    <rect x="440" y="620" width="220" height="300" fill="#2a1810"/>
    <!-- Head -->
    <ellipse cx="580" cy="510" rx="52" ry="60" fill="#0a0907"/>
    <!-- Hair -->
    <path d="M 525 500 Q 530 445 580 440 Q 630 445 635 500 Q 615 465 580 460 Q 545 465 525 500 Z" fill="#0a0907"/>
    <!-- Face (visible, in profile/three-quarter) -->
    <path d="M 545 490 Q 540 520 550 545 Q 570 555 595 550 Q 610 540 615 515 Q 615 490 605 480 Q 590 470 570 475 Z" fill="#2a221a"/>
    <!-- Eye (subtle) -->
    <circle cx="590" cy="505" r="4" fill="#0a0907"/>
    <!-- Nose and mouth (implied) -->
    <path d="M 612 510 L 620 520 L 612 522" stroke="#0a0907" stroke-width="2" fill="none"/>
    <path d="M 602 535 Q 590 540 578 538" stroke="#0a0907" stroke-width="2" fill="none"/>
    <!-- Collar of the coat (open) -->
    <path d="M 500 590 Q 540 560 580 555 Q 620 560 660 590
             Q 640 640 580 650 Q 520 640 500 590 Z" fill="#2a2823"/>
    <!-- Coat/shoulders -->
    <path d="M 440 820
             Q 440 660 520 610
             Q 560 590 580 590
             Q 600 590 640 610
             Q 720 660 720 820 Z" fill="#1a1815"/>
    <!-- White shirt collar -->
    <path d="M 555 595 L 580 620 L 605 595 Q 580 585 555 595 Z" fill="#ece4d4"/>
    <!-- Arms on the desk -->
    <path d="M 470 780 Q 520 800 620 810" stroke="#1a1815" stroke-width="40" fill="none" stroke-linecap="round"/>
  </g>

  <!-- MARC (right, seated in client chair) -->
  <g>
    <!-- Chair back -->
    <rect x="1250" y="660" width="220" height="280" fill="#2a1810"/>
    <!-- Head -->
    <ellipse cx="1370" cy="545" rx="50" ry="58" fill="#0a0907"/>
    <!-- Hair (short, tidy) -->
    <path d="M 1320 530 Q 1325 480 1370 475 Q 1415 480 1420 530 Q 1405 495 1370 495 Q 1335 495 1320 530 Z" fill="#0a0907"/>
    <!-- Face (three-quarter, facing left toward Adrian) -->
    <path d="M 1330 525 Q 1325 555 1335 580 Q 1355 590 1380 585 Q 1400 575 1405 550 Q 1400 525 1390 515 Q 1365 505 1345 510 Z" fill="#2a221a"/>
    <!-- Reading glasses (thin wire) -->
    <circle cx="1345" cy="540" r="10" fill="none" stroke="#a07c50" stroke-width="2"/>
    <line x1="1355" y1="540" x2="1385" y2="542" stroke="#a07c50" stroke-width="2"/>
    <circle cx="1385" cy="542" r="10" fill="none" stroke="#a07c50" stroke-width="2"/>
    <!-- Eye behind glasses -->
    <circle cx="1345" cy="540" r="3" fill="#0a0907"/>
    <!-- Sweater collar (dark olive) -->
    <path d="M 1290 630 Q 1330 600 1370 595 Q 1410 600 1450 630
             Q 1430 680 1370 690 Q 1310 680 1290 630 Z" fill="#4a5a44"/>
    <!-- Sweater body -->
    <path d="M 1230 820
             Q 1230 700 1310 640
             Q 1350 620 1370 620
             Q 1390 620 1430 640
             Q 1510 700 1510 820 Z" fill="#4a5a44"/>
    <!-- Checkered shirt collar (under sweater) -->
    <path d="M 1345 625 L 1370 650 L 1395 625 Q 1370 615 1345 625 Z" fill="#d9ceb8"/>
    <path d="M 1355 635 L 1370 650 L 1385 635" stroke="#7a2f2a" stroke-width="2" fill="none"/>
    <!-- Satchel strap across chest -->
    <path d="M 1300 660 L 1440 780" stroke="#8a5a30" stroke-width="10" fill="none"/>
    <!-- Arms on lap/desk -->
    <path d="M 1280 790 Q 1320 800 1380 800" stroke="#4a5a44" stroke-width="35" fill="none" stroke-linecap="round"/>
    <!-- Hands on the desk -->
    <ellipse cx="1310" cy="810" rx="22" ry="16" fill="#2a221a"/>
    <ellipse cx="1430" cy="810" rx="22" ry="16" fill="#2a221a"/>
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>