<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="roomDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1b1a17"/>
      <stop offset="100%" stop-color="#0a0907"/>
    </linearGradient>
    <linearGradient id="hallLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d9c8a8"/>
      <stop offset="100%" stop-color="#b09070"/>
    </linearGradient>
    <radialGradient id="doorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f4dca8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f4dca8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#roomDark)"/>

  <!-- Hallway beyond the door (bright) -->
  <g>
    <rect x="700" y="200" width="700" height="880" fill="url(#hallLight)"/>
    <!-- Hallway wall (perspective lines) -->
    <line x1="700" y1="200" x2="700" y2="1080" stroke="#0a0907" stroke-width="8"/>
    <line x1="1400" y1="200" x2="1400" y2="1080" stroke="#0a0907" stroke-width="8"/>
    <!-- Hallway floor reflection -->
    <ellipse cx="1050" cy="1000" rx="320" ry="80" fill="#c8a880" opacity="0.4"/>
    <!-- Hallway far wall detail (a distant window or lamp) -->
    <rect x="980" y="360" width="140" height="180" fill="#8a7860" opacity="0.7"/>
    <rect x="980" y="360" width="140" height="180" fill="none" stroke="#0a0907" stroke-width="3"/>
  </g>

  <!-- Door frame -->
  <g>
    <!-- Left door jamb -->
    <rect x="660" y="160" width="40" height="920" fill="#2a1810" stroke="#0a0907" stroke-width="4"/>
    <!-- Right door jamb -->
    <rect x="1400" y="160" width="40" height="920" fill="#2a1810" stroke="#0a0907" stroke-width="4"/>
    <!-- Top frame -->
    <rect x="660" y="120" width="780" height="60" fill="#2a1810" stroke="#0a0907" stroke-width="4"/>

    <!-- The door itself (open inward, on the right side) -->
    <path d="M 1400 180 L 1740 240 L 1740 1000 L 1400 1040 Z" fill="#3a2215" stroke="#0a0907" stroke-width="4"/>
    <!-- Door panels -->
    <rect x="1430" y="320" width="260" height="280" fill="#2a1810" stroke="#0a0907" stroke-width="2" transform="skewY(4)"/>
    <rect x="1430" y="660" width="260" height="280" fill="#2a1810" stroke="#0a0907" stroke-width="2" transform="skewY(4)"/>
    <!-- Doorknob -->
    <circle cx="1480" cy="620" r="14" fill="#b9905a" stroke="#0a0907" stroke-width="2"/>
  </g>

  <!-- Marc silhouette in the doorway -->
  <g fill="#0a0907">
    <!-- Head -->
    <ellipse cx="1050" cy="360" rx="55" ry="62"/>
    <!-- Hair (short-cropped) -->
    <path d="M 995 340 Q 1000 295 1050 290 Q 1100 295 1105 340 Q 1090 315 1050 310 Q 1010 315 995 340 Z" fill="#0a0907"/>
    <!-- Neck + shoulders + sweater silhouette -->
    <path d="M 920 660
             Q 935 500 990 440
             Q 1015 420 1050 420
             Q 1085 420 1110 440
             Q 1165 500 1180 660
             Z"/>
    <!-- Satchel strap (thin line across the body) -->
    <path d="M 970 480 L 1130 700" stroke="#3a2a1a" stroke-width="8" fill="none"/>
    <!-- Hand holding the strap (small detail) -->
    <circle cx="1080" cy="640" r="20" fill="#0a0907"/>
  </g>

  <!-- Warm light spill from the doorway onto the office floor (foreground) -->
  <path d="M 700 1080 L 1400 1080 L 1600 1080 L 400 1080 Z" fill="url(#doorGlow)"/>

  <!-- Foreground silhouette (Adrian's shoulder, out of focus, bottom-left) -->
  <path d="M -50 1080 Q 100 950 250 950 Q 400 950 500 1080 Z" fill="#000" opacity="0.85"/>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>