<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="wallWide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a332a"/>
      <stop offset="100%" stop-color="#1b1a17"/>
    </linearGradient>
    <linearGradient id="floorWide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a221a"/>
      <stop offset="100%" stop-color="#0a0907"/>
    </linearGradient>
    <radialGradient id="lampWide" cx="50%" cy="35%" r="50%">
      <stop offset="0%"   stop-color="#f4dca8" stop-opacity="0.9"/>
      <stop offset="40%"  stop-color="#d9b47a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d9b47a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowWide" cx="15%" cy="40%" r="35%">
      <stop offset="0%"   stop-color="#a8b8c8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a8b8c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#wallWide)"/>
  <rect x="0" y="800" width="1920" height="280" fill="url(#floorWide)"/>

  <!-- Back wall paneling (visible in wider frame) -->
  <g stroke="#0a0907" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="520" x2="1920" y2="520"/>
    <line x1="0" y1="680" x2="1920" y2="680"/>
  </g>

  <!-- Window on far left -->
  <g>
    <rect x="40" y="220" width="380" height="540" fill="#1a2430"/>
    <rect x="40" y="220" width="380" height="540" fill="none" stroke="#0a0907" stroke-width="6"/>
    <line x1="230" y1="220" x2="230" y2="760" stroke="#0a0907" stroke-width="5"/>
    <line x1="40" y1="490" x2="420" y2="490" stroke="#0a0907" stroke-width="5"/>
    <rect x="40" y="220" width="380" height="540" fill="url(#windowWide)"/>
  </g>

  <!-- The empty rectangle on the wall (where a license should hang) -->
  <g>
    <rect x="820" y="180" width="280" height="180" fill="none" stroke="#0a0907" stroke-width="3" stroke-dasharray="8 6" opacity="0.5"/>
    <!-- Shadow inside, hinting where the frame used to be -->
    <rect x="830" y="190" width="260" height="160" fill="#000" opacity="0.3"/>
  </g>

  <!-- Bookshelf on the right -->
  <g>
    <rect x="1500" y="280" width="380" height="540" fill="#1a1208" stroke="#0a0907" stroke-width="5"/>
    <line x1="1500" y1="420" x2="1880" y2="420" stroke="#0a0907" stroke-width="3"/>
    <line x1="1500" y1="560" x2="1880" y2="560" stroke="#0a0907" stroke-width="3"/>
    <line x1="1500" y1="700" x2="1880" y2="700" stroke="#0a0907" stroke-width="3"/>
    <!-- A few books -->
    <rect x="1530" y="320" width="18" height="90" fill="#7a2f2a"/>
    <rect x="1555" y="335" width="14" height="75" fill="#4a5a44"/>
    <rect x="1580" y="310" width="16" height="100" fill="#2a2823"/>
    <rect x="1620" y="340" width="22" height="70" fill="#b9905a"/>
    <rect x="1550" y="600" width="18" height="90" fill="#2a2823"/>
    <rect x="1720" y="610" width="20" height="80" fill="#4a5a44"/>
  </g>

  <!-- Wall lamp (right, adds warmth) -->
  <g>
    <ellipse cx="1700" cy="160" rx="35" ry="10" fill="#0a0907"/>
    <circle cx="1700" cy="160" r="8" fill="#d9b47a" opacity="0.8"/>
    <ellipse cx="1700" cy="240" rx="180" ry="130" fill="url(#lampWide)" opacity="0.3"/>
  </g>

  <!-- Desk (foreground, wider framing) -->
  <g>
    <rect x="620" y="800" width="680" height="35" fill="#5a3a2a" stroke="#0a0907" stroke-width="3"/>
    <rect x="640" y="835" width="28" height="200" fill="#3a2010"/>
    <rect x="1250" y="835" width="28" height="200" fill="#3a2010"/>
  </g>

  <!-- Desk lamp (smaller in wider frame) -->
  <g>
    <ellipse cx="960" cy="795" rx="45" ry="7" fill="#1a0808"/>
    <rect x="953" y="735" width="14" height="60" fill="#0a0907"/>
    <path d="M 915 735 L 1005 735 L 990 705 L 930 705 Z" fill="#4a6a4a" stroke="#0a0907" stroke-width="3"/>
    <ellipse cx="960" cy="737" rx="50" ry="8" fill="#3a5a3a"/>
    <ellipse cx="960" cy="737" rx="38" ry="4" fill="#f4dca8"/>
    <ellipse cx="960" cy="900" rx="380" ry="220" fill="url(#lampWide)" opacity="0.7"/>
  </g>

  <!-- Papers on the desk -->
  <g fill="#ece4d4" stroke="#8a7860" stroke-width="1">
    <rect x="850" y="790" width="80" height="16" transform="rotate(-3 890 798)"/>
    <rect x="880" y="786" width="80" height="16" transform="rotate(1 920 794)"/>
    <rect x="1000" y="790" width="70" height="16" transform="rotate(-1 1035 798)"/>
  </g>

  <!-- ADRIAN (left, seated, silhouette-ish but visible face) -->
  <g>
    <!-- Chair back -->
    <rect x="470" y="640" width="180" height="240" fill="#2a1810"/>
    <!-- Head -->
    <ellipse cx="560" cy="540" rx="42" ry="48" fill="#0a0907"/>
    <!-- Hair -->
    <path d="M 520 530 Q 525 490 560 485 Q 595 490 600 530 Q 585 505 560 502 Q 535 505 520 530 Z" fill="#0a0907"/>
    <!-- Face (three-quarter, looking right toward Marc) -->
    <path d="M 545 525 Q 540 545 550 565 Q 565 572 585 568 Q 595 555 595 538 Q 590 522 580 515 Q 560 510 545 525 Z" fill="#2a221a"/>
    <!-- Eye -->
    <circle cx="575" cy="538" r="3" fill="#0a0907"/>
    <!-- Coat -->
    <path d="M 490 800 Q 490 660 545 615 Q 560 605 570 605 Q 590 605 620 620 Q 640 660 640 800 Z" fill="#1a1815"/>
    <!-- White shirt collar -->
    <path d="M 545 610 L 570 630 L 595 610 Q 570 600 545 610 Z" fill="#ece4d4"/>
  </g>

  <!-- MARC (right, seated) -->
  <g>
    <!-- Chair -->
    <rect x="1290" y="660" width="180" height="220" fill="#2a1810"/>
    <!-- Head -->
    <ellipse cx="1380" cy="565" rx="40" ry="46" fill="#0a0907"/>
    <!-- Hair -->
    <path d="M 1345 555 Q 1350 515 1380 512 Q 1410 515 1415 555 Q 1400 525 1380 525 Q 1360 525 1345 555 Z" fill="#0a0907"/>
    <!-- Face (three-quarter, looking left toward Adrian) -->
    <path d="M 1355 550 Q 1350 570 1360 585 Q 1375 590 1395 585 Q 1405 570 1405 555 Q 1395 540 1385 535 Q 1365 532 1355 550 Z" fill="#2a221a"/>
    <!-- Glasses -->
    <circle cx="1370" cy="558" r="8" fill="none" stroke="#a07c50" stroke-width="2"/>
    <circle cx="1398" cy="558" r="8" fill="none" stroke="#a07c50" stroke-width="2"/>
    <line x1="1378" y1="558" x2="1390" y2="558" stroke="#a07c50" stroke-width="2"/>
    <!-- Sweater -->
    <path d="M 1300 800 Q 1300 680 1350 630 Q 1380 615 1400 620 Q 1440 640 1450 800 Z" fill="#4a5a44"/>
    <!-- Checkered shirt -->
    <path d="M 1365 625 L 1380 645 L 1395 625 Q 1380 615 1365 625 Z" fill="#d9ceb8"/>
    <!-- Satchel strap -->
    <path d="M 1330 660 L 1430 750" stroke="#8a5a30" stroke-width="8" fill="none"/>
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>